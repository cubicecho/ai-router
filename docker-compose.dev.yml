# Postgres alone, for `npm run dev` and `npm run db:migrate`. `npm run db:up`.
# Its own project name, so it never collides with docker-compose.yml's containers.
name: ai-router-dev
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment: { POSTGRES_USER: router, POSTGRES_PASSWORD: router, POSTGRES_DB: router }
    ports:
      # Loopback by default. Set DEV_BIND=0.0.0.0 when the Docker daemon is remote (`docker context ls`),
      # because 127.0.0.1 there is the daemon host's loopback.
      - "${DEV_BIND:-127.0.0.1}:${POSTGRES_PORT:-5440}:5432"
    volumes: [ai_router_dev_pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U router -d router"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  ai_router_dev_pgdata:
