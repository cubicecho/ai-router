name: CI
on:
  push: { branches: [main] }
  pull_request:
  # preview.yml runs these checks before it builds a branch's image.
  workflow_call:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 26, cache: npm }
      - run: npm ci
      # Generated files aren't in the tree, so codegen runs before anything reads them.
      - run: npm run codegen
      - name: Lint
        run: npx biome ci .
      - name: Typecheck
        run: npm run check:types
      - name: Test
        run: npm test

  # The worker package (#71): it packs, installs on the oldest Node it names, and starts far enough to refuse a
  # missing router address. The tarball is kept as the run's artifact.
  worker-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 26, cache: npm }
      - run: npm ci
      - run: npm run pack:worker
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - name: It installs and starts on Node 22
        run: |
          npm install -g ./cubicecho-ai-router-worker-*.tgz
          if ai-router-worker > worker.log 2>&1; then
            cat worker.log
            echo "::error::The worker started with no router address."
            exit 1
          fi
          cat worker.log
          grep -q 'AI_ROUTER_URL' worker.log
      - uses: actions/upload-artifact@v4
        with:
          name: ai-router-worker
          path: cubicecho-ai-router-worker-*.tgz

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_USER: ci, POSTGRES_PASSWORD: ci, POSTGRES_DB: ci }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://ci:ci@127.0.0.1:5432/ci
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 26, cache: npm }
      - run: npm ci
      - name: Migrations apply
        run: npm run db:migrate
      # drizzle-kit writes nothing when the tables and the migrations agree.
      - name: Migrations match the tables
        run: |
          npm run db:generate
          if [ -n "$(git status --porcelain drizzle)" ]; then
            git status --porcelain drizzle
            echo "::error::The tables changed without a migration. Run npm run db:generate and commit drizzle/."
            exit 1
          fi

  boot:
    runs-on: ubuntu-latest
    env:
      # Preflight rejects short or default secrets in production. CI-only, never deployed.
      BETTER_AUTH_SECRET: ci-only-0123456789abcdef0123456789abcdef
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: ai-router
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start the stack
        run: docker compose up -d --no-build --wait --wait-timeout 180
      - name: /healthz answers, with stdio servers isolated
        run: |
          curl -fsS http://127.0.0.1:3000/healthz | tee health.json
          grep -q '"children":"isolated"' health.json
      - name: A child user is boxed in
        run: docker compose exec -T ai-router sh scripts/check-children.sh
      # The worker program's image: it builds, and starts far enough to refuse a missing router address.
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: worker
          push: false
          load: true
          tags: ai-router-worker
          cache-from: type=gha,scope=worker
          cache-to: type=gha,scope=worker,mode=max
      - name: The worker image starts
        run: |
          if docker run --rm ai-router-worker > worker.log 2>&1; then
            cat worker.log
            echo "::error::The worker started with no router address."
            exit 1
          fi
          cat worker.log
          grep -q 'AI_ROUTER_URL' worker.log
      - name: Logs
        if: failure()
        run: docker compose logs
