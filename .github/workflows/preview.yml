# Preview images for a long-lived feature branch, to run beside the released router.
#
# After CI passes on the branch, the same Dockerfile is pushed to GHCR only, as
# ghcr.io/<repo>:<branch name> (moves with the branch) and :<branch name>-<short sha> (pinned).
# Nothing here runs semantic-release, cuts a tag or a GitHub release, or pushes :latest, a version
# tag or Docker Hub. The branch's migrations need a database of its own: see README.md.
#
# To preview another branch, add it here and to ci.yml's push branches.

name: Preview

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [feat/workers]

concurrency:
  group: preview-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  image:
    # Only a push to the branch publishes, never a pull request whose head is named the same.
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      # The tag is the branch's last segment (feat/workers -> workers), and the commit's short sha.
      - name: Tags
        id: tags
        env:
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          NAME="${BRANCH##*/}"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "sha=${SHA:0:7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          cache-from: type=gha
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.tags.outputs.name }}
            ghcr.io/${{ github.repository }}:${{ steps.tags.outputs.name }}-${{ steps.tags.outputs.sha }}
