# The router beside its own Postgres. `docker compose up`.
name: ai-router
services:
  ai-router:
    image: ${AI_ROUTER_IMAGE:-ai-router}
    build: .
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET is required. Generate one with `openssl rand -hex 32`}
      DATABASE_URL: postgres://router:${POSTGRES_PASSWORD:-router}@postgres:5432/router
      APP_URL: ${APP_URL:-http://localhost:3000}
      SECURE_LOCAL_NET: ${SECURE_LOCAL_NET:-false}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_NAME: ${OIDC_NAME:-}
      # mDNS needs multicast, which this bridge network drops: see "Finding and being found" in the README.
      MDNS_ADVERTISE: ${MDNS_ADVERTISE:-false}
      MDNS_DISCOVER: ${MDNS_DISCOVER:-false}
    ports:
      - "${PORT:-3000}:3000"
    # The MCP servers' installs, from phase 3. A named volume: a bind mount keeps the host folder's owner.
    volumes: [ai_router_data:/data]
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment: { POSTGRES_USER: router, POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-router}", POSTGRES_DB: router }
    # No `ports`. The database is for the router beside it.
    volumes: [ai_router_pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U router -d router"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  ai_router_data:
  ai_router_pgdata:
