fragment PoolFields on Pool {
  id
  name
  displayName
  description
  enabled
  strategy
  affinity
  maxLoadFactor
  # A pool may have 64 targets (MODEL_CONFIG_DEFAULTS.maxTargets), more than the default page of 50. The targets
  # dialog saves the list whole, so it must be given all of them.
  targets(orderBy: { position: { direction: asc, priority: 1 } }, limit: 64) {
    id
    model
    position
    weight
    provider {
      id
      name
      enabled
    }
  }
}

# The list shows only how many targets each pool has: selecting them whole prices each row at a page of targets with
# their providers, past the operation limit.
query Pools {
  pools(orderBy: { name: { direction: asc, priority: 1 } }) {
    id
    name
    displayName
    enabled
    strategy
    targets(limit: 64) {
      id
    }
  }
}

query Pool($id: UUID!) {
  pool(where: { id: { eq: $id } }) {
    ...PoolFields
  }
  providers(orderBy: { name: { direction: asc, priority: 1 } }) {
    id
    name
  }
}

query PoolLoad($id: UUID!) {
  poolLoad(id: $id) {
    providerId
    model
    inFlight
    reachable
    checkedAt
    downReason
  }
}

mutation CreatePool($values: CreatePoolInput!) {
  createPool(values: $values) {
    ...PoolFields
  }
}

mutation UpdatePool($id: UUID!, $set: UpdatePoolInput!) {
  updatePool(where: { id: { eq: $id } }, set: $set) {
    ...PoolFields
  }
}

mutation DeletePool($id: UUID!) {
  deletePool(where: { id: { eq: $id } }) {
    id
  }
}

mutation SetPoolTargets($poolId: UUID!, $targets: [PoolTargetInput!]!) {
  setPoolTargets(poolId: $poolId, targets: $targets) {
    ...PoolFields
  }
}
