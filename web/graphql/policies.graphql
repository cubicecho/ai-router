fragment OverridePolicyFields on OverridePolicy {
  id
  name
  description
  rules
  isDefault
  agents(orderBy: { name: { direction: asc, priority: 1 } }) {
    id
    name
  }
}

query OverridePolicies {
  overridePolicies(orderBy: { name: { direction: asc, priority: 1 } }) {
    ...OverridePolicyFields
  }
}

mutation CreateOverridePolicy($values: OverridePolicyInput!) {
  createOverridePolicy(values: $values) {
    ...OverridePolicyFields
  }
}

mutation UpdateOverridePolicy($id: UUID!, $values: OverridePolicyInput!) {
  updateOverridePolicy(id: $id, values: $values) {
    ...OverridePolicyFields
  }
}

mutation DeleteOverridePolicy($id: UUID!) {
  deleteOverridePolicy(id: $id) {
    id
  }
}

mutation SetAgentOverridePolicy($id: UUID!, $policyId: UUID!) {
  setAgentOverridePolicy(id: $id, policyId: $policyId) {
    id
    overridePolicy {
      id
      name
    }
  }
}
