fragment UsageFields on UsageCount {
  id
  day
  workspaceName
  agentName
  poolId
  poolName
  providerId
  providerName
  model
  requests
  inputTokens
  outputTokens
}

# Every price people have entered, for the cost beside usage. Few enough to read whole.
query PriceBook {
  modelPrices(limit: 500) {
    providerId
    model
    inputPerMillion
    outputPerMillion
  }
  pools(limit: 500) {
    id
    inputPricePerMillion
    outputPricePerMillion
  }
}

query UsageByProvider($providerId: UUID!) {
  usageCounts(
    where: { providerId: { eq: $providerId } }
    orderBy: { day: { direction: desc, priority: 1 } }
    limit: 500
  ) {
    ...UsageFields
  }
}

query UsageByPool($poolId: UUID!) {
  usageCounts(where: { poolId: { eq: $poolId } }, orderBy: { day: { direction: desc, priority: 1 } }, limit: 500) {
    ...UsageFields
  }
}

query UsageByWorkspace($workspaceId: UUID!) {
  usageCounts(
    where: { workspaceId: { eq: $workspaceId } }
    orderBy: { day: { direction: desc, priority: 1 } }
    limit: 500
  ) {
    ...UsageFields
  }
}
