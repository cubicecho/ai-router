fragment RunRowFields on Run {
  id
  agentId
  agentName
  workspaceId
  workspaceName
  sessionKey
  status
  startedAt
  finishedAt
  inputTokens
  outputTokens
  error
  worker {
    id
    name
    host
  }
}

# The higher priority sorts first: newest first, and the id breaks a tie so pages don't overlap.
query Runs($where: RunFilters, $limit: Int!, $offset: Int!) {
  runs(
    where: $where
    orderBy: { startedAt: { direction: desc, priority: 2 }, id: { direction: desc, priority: 1 } }
    limit: $limit
    offset: $offset
  ) {
    ...RunRowFields
  }
  runsAggregate(where: $where) {
    count
  }
}

# The latest session first. A session's runs are read with Runs, filtered by its key.
query RunSessions($workspaceId: UUID, $agentName: String, $limit: Int!, $offset: Int!) {
  runSessions(workspaceId: $workspaceId, agentName: $agentName, limit: $limit, offset: $offset) {
    count
    sessions {
      key
      title
      workspaceId
      workspaceName
      agentNames
      runCount
      openRunCount
      failedRunCount
      cancelledRunCount
      lastStatus
      lastError
      startedAt
      lastStartedAt
      lastFinishedAt
      runMs
      inputTokens
      outputTokens
    }
  }
}

query RunFilterChoices {
  agents(orderBy: { name: { direction: asc, priority: 1 } }) {
    id
    name
    liveRevision {
      id
      document
    }
  }
  workspaces(orderBy: { name: { direction: asc, priority: 1 } }) {
    id
    name
    slug
  }
}

query Run($id: UUID!) {
  run(where: { id: { eq: $id } }) {
    ...RunRowFields
    revisionId
    user
    stream
    idempotencyKey
    input
    answer
    agent {
      id
      name
      liveRevision {
        id
        document
      }
    }
    revision {
      id
      number
    }
    workspace {
      id
      name
    }
  }
}

subscription RunEvents($runId: UUID!) {
  runEvents(runId: $runId) {
    runId
    seq
    at
    kind
    text
    name
    id
    exchange
    ok
    usage
    level
    link
    loads
    via
    fields
  }
}

mutation CancelRun($id: UUID!) {
  cancelRun(id: $id) {
    id
    status
    error
  }
}
