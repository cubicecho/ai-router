fragment AgentRevisionFields on AgentRevision {
  id
  agentId
  number
  document
  warnings
  message
  createdBy
  savedByWorkspaceId
  savedByAgentId
  basedOnId
  createdAt
  promotedAt
  creator {
    name
    email
  }
  savedByWorkspace {
    id
    name
  }
  savedByAgent {
    id
    name
  }
  basedOn {
    id
    number
  }
}

query Agents {
  agents(orderBy: { name: { direction: asc, priority: 1 } }) {
    id
    name
    liveRevisionId
    liveRevision {
      id
      number
      document
    }
    revisions {
      id
      promotedAt
    }
    workspaces {
      id
    }
  }
}

query Agent($id: UUID!) {
  agent(where: { id: { eq: $id } }) {
    id
    name
    liveRevisionId
    autoPromote
    overridePolicy {
      id
      name
      description
    }
    liveRevision {
      ...AgentRevisionFields
    }
    revisions(orderBy: { number: { direction: desc, priority: 1 } }) {
      ...AgentRevisionFields
    }
    workspaces(orderBy: { workspace: { name: { direction: asc, priority: 1 } } }) {
      id
      workspace {
        id
        name
      }
    }
  }
}

# The workspaces an agent can be offered in, from its page.
query AgentWorkspaceChoices {
  workspaces(orderBy: { name: { direction: asc, priority: 1 } }) {
    id
    name
    slug
  }
}

query UsageByAgent($agentId: UUID!) {
  usageCounts(where: { agentId: { eq: $agentId } }, orderBy: { day: { direction: desc, priority: 1 } }, limit: 500) {
    ...UsageFields
  }
}

query CheckAgent($document: JSON!, $id: UUID) {
  checkAgent(document: $document, id: $id) {
    errors
    warnings
  }
}

mutation CreateAgent($document: JSON!, $message: String) {
  createAgent(document: $document, message: $message) {
    id
    name
    liveRevision {
      id
      number
      warnings
    }
  }
}

mutation SaveAgent($id: UUID!, $document: JSON!, $message: String) {
  saveAgent(id: $id, document: $document, message: $message) {
    id
    number
    warnings
  }
}

mutation PromoteRevision($id: UUID!) {
  promoteRevision(id: $id) {
    id
    liveRevisionId
  }
}

mutation DiscardRevision($id: UUID!) {
  discardRevision(id: $id) {
    id
    liveRevisionId
  }
}

mutation SetAgentAutoPromote($id: UUID!, $autoPromote: Boolean!) {
  setAgentAutoPromote(id: $id, autoPromote: $autoPromote) {
    id
    autoPromote
  }
}

mutation DeleteAgent($id: UUID!) {
  deleteAgent(where: { id: { eq: $id } }) {
    id
  }
}

fragment WorkspaceAgentChoice on Agent {
  id
  name
  liveRevisionId
  liveRevision {
    id
    document
  }
}

query WorkspaceAgents($workspaceId: UUID!) {
  workspaceAgents(
    where: { workspaceId: { eq: $workspaceId } }
    orderBy: { agent: { name: { direction: asc, priority: 1 } } }
  ) {
    id
    agentId
    agent {
      ...WorkspaceAgentChoice
    }
  }
  agents(orderBy: { name: { direction: asc, priority: 1 } }) {
    ...WorkspaceAgentChoice
  }
}

mutation CreateWorkspaceAgent($workspaceId: UUID!, $agentId: UUID!) {
  createWorkspaceAgent(values: { workspaceId: $workspaceId, agentId: $agentId }) {
    id
  }
}

mutation DeleteWorkspaceAgent($id: UUID!) {
  deleteWorkspaceAgent(where: { id: { eq: $id } }) {
    id
  }
}
