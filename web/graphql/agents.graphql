fragment AgentRevisionFields on AgentRevision {
  id
  agentId
  number
  document
  warnings
  message
  createdBy
  savedByWorkspaceId
  savedByAgentId
  basedOnId
  createdAt
  promotedAt
  creator {
    name
    email
  }
  savedByWorkspace {
    id
    name
  }
  savedByAgent {
    id
    name
  }
  basedOn {
    id
    number
  }
}

query Agents {
  agents(orderBy: { name: { direction: asc, priority: 1 } }) {
    id
    name
    liveRevisionId
    liveRevision {
      id
      number
      document
    }
    revisions {
      id
      promotedAt
    }
    workspaces {
      id
    }
  }
}

query Agent($id: UUID!) {
  agent(where: { id: { eq: $id } }) {
    id
    name
    liveRevisionId
    autoPromote
    liveRevision {
      ...AgentRevisionFields
    }
    revisions(orderBy: { number: { direction: desc, priority: 1 } }) {
      ...AgentRevisionFields
    }
    workspaces(orderBy: { workspace: { name: { direction: asc, priority: 1 } } }) {
      id
      workspace {
        id
        name
      }
    }
  }
  # The servers of the workspaces it is in: one flat list, so the cost doesn't multiply by its workspaces.
  agentWorkspaceServers: workspaceServers(
    where: { workspace: { agents: { some: { agentId: { eq: $id } } } } }
    limit: 500
  ) {
    workspaceId
    serverId
    server {
      name
      displayName
    }
  }
  # The servers turned off for it in each workspace: one flat list, so the cost doesn't multiply by its workspaces.
  agentDisabledServers: workspaceAgentDisabledServers(where: { workspaceAgent: { agentId: { eq: $id } } }, limit: 500) {
    workspaceAgentId
    serverId
  }
}

# The workspaces an agent can be offered in, from its page.
query AgentWorkspaceChoices {
  workspaces(orderBy: { name: { direction: asc, priority: 1 } }) {
    id
    name
    slug
  }
}

query UsageByAgent($agentId: UUID!) {
  usageCounts(where: { agentId: { eq: $agentId } }, orderBy: { day: { direction: desc, priority: 1 } }, limit: 500) {
    ...UsageFields
  }
}

query CheckAgent($document: JSON!, $id: UUID) {
  checkAgent(document: $document, id: $id) {
    errors
    warnings
  }
}

mutation CreateAgent($document: JSON!, $message: String) {
  createAgent(document: $document, message: $message) {
    id
    name
    liveRevision {
      id
      number
      warnings
    }
  }
}

mutation SaveAgent($id: UUID!, $document: JSON!, $message: String) {
  saveAgent(id: $id, document: $document, message: $message) {
    id
    number
    warnings
  }
}

mutation PromoteRevision($id: UUID!) {
  promoteRevision(id: $id) {
    id
    liveRevisionId
  }
}

mutation DiscardRevision($id: UUID!) {
  discardRevision(id: $id) {
    id
    liveRevisionId
  }
}

mutation SetAgentAutoPromote($id: UUID!, $autoPromote: Boolean!) {
  setAgentAutoPromote(id: $id, autoPromote: $autoPromote) {
    id
    autoPromote
  }
}

mutation DeleteAgent($id: UUID!) {
  deleteAgent(where: { id: { eq: $id } }) {
    id
  }
}

fragment WorkspaceAgentChoice on Agent {
  id
  name
  liveRevisionId
  liveRevision {
    id
    document
  }
}

query WorkspaceAgents($workspaceId: UUID!) {
  workspaceAgents(
    where: { workspaceId: { eq: $workspaceId } }
    orderBy: { agent: { name: { direction: asc, priority: 1 } } }
  ) {
    id
    agentId
    agent {
      ...WorkspaceAgentChoice
    }
  }
  # The servers turned off for each of them here: one flat list, so the cost doesn't multiply by the agents.
  disabledServers: workspaceAgentDisabledServers(
    where: { workspaceAgent: { workspaceId: { eq: $workspaceId } } }
    limit: 500
  ) {
    workspaceAgentId
    serverId
  }
  # The tools turned off for each of them here, by the tool's own name on its server.
  disabledTools: workspaceAgentDisabledTools(
    where: { workspaceAgent: { workspaceId: { eq: $workspaceId } } }
    limit: 500
  ) {
    workspaceAgentId
    serverId
    tool
  }
  agents(orderBy: { name: { direction: asc, priority: 1 } }) {
    ...WorkspaceAgentChoice
  }
  # Every agent here reaches these, unless one is turned off for it.
  workspaceServers(where: { workspaceId: { eq: $workspaceId } }, limit: 500) {
    serverId
    server {
      id
      name
      displayName
      enabled
      transport
    }
  }
}

mutation SetWorkspaceAgentServerEnabled($workspaceAgentId: UUID!, $serverId: UUID!, $enabled: Boolean!) {
  setWorkspaceAgentServerEnabled(workspaceAgentId: $workspaceAgentId, serverId: $serverId, enabled: $enabled)
}

mutation SetWorkspaceAgentToolEnabled($workspaceAgentId: UUID!, $serverId: UUID!, $tool: String!, $enabled: Boolean!) {
  setWorkspaceAgentToolEnabled(workspaceAgentId: $workspaceAgentId, serverId: $serverId, tool: $tool, enabled: $enabled)
}

mutation CreateWorkspaceAgent($workspaceId: UUID!, $agentId: UUID!) {
  createWorkspaceAgent(values: { workspaceId: $workspaceId, agentId: $agentId }) {
    id
  }
}

mutation DeleteWorkspaceAgent($id: UUID!) {
  deleteWorkspaceAgent(where: { id: { eq: $id } }) {
    id
  }
}
